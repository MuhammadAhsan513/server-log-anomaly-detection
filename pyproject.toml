[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "log-anomaly"
version = "0.2.0"
description = "Traceable log ingestion, window features, and exploratory analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eda = ["matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
