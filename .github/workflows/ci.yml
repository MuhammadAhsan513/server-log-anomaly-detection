name: Verify batch pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m log_anomaly --help
      - run: python -m pytest -q
      - name: Seeded evaluation and measured failure regression
        run: python scripts/evaluate_fixtures.py --seeds 11 --output artifacts/ci-evaluation
      - name: Raw CSV to validated reports with release configuration
        run: python -m log_anomaly run --input artifacts/ci-evaluation/seed-11/fixture/logs.csv --config configs/default.json --output artifacts/ci-run
